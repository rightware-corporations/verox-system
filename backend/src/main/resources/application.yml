spring:
  application:
    name: verox-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/verox}
    username: ${DB_USERNAME:verox}
    password: ${DB_PASSWORD:verox_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

verox:
  bootstrap:
    enabled: ${VEROX_BOOTSTRAP_ENABLED:false}
    merchant-name: ${VEROX_BOOTSTRAP_MERCHANT_NAME:VEROX MVP Merchant}
    environment: ${VEROX_BOOTSTRAP_ENVIRONMENT:TEST}
  bridge:
    bootstrap:
      enabled: ${VEROX_BRIDGE_BOOTSTRAP_ENABLED:false}
      merchant-name: ${VEROX_BRIDGE_BOOTSTRAP_MERCHANT_NAME:VEROX MVP Merchant}
      environment: ${VEROX_BRIDGE_BOOTSTRAP_ENVIRONMENT:TEST}
      name: ${VEROX_BRIDGE_BOOTSTRAP_NAME:M-Pesa Receiving Bridge}
      provider: ${VEROX_BRIDGE_BOOTSTRAP_PROVIDER:MPESA}
  checkout:
    base-url: ${VEROX_CHECKOUT_BASE_URL:http://localhost:3000}
    session-ttl-minutes: ${VEROX_CHECKOUT_TTL_MINUTES:15}
    capability-master-secret: ${VEROX_CHECKOUT_CAPABILITY_MASTER_SECRET:verox-dev-checkout-capability-master-secret-change-me}
  verification:
    provider-evidence-grace-seconds: ${VEROX_PROVIDER_EVIDENCE_GRACE_SECONDS:300}
  webhook:
    master-secret: ${VEROX_WEBHOOK_MASTER_SECRET:verox-dev-webhook-master-secret-change-me}
    delivery:
      poll-delay-ms: ${VEROX_WEBHOOK_POLL_DELAY_MS:2000}
      connect-timeout-seconds: ${VEROX_WEBHOOK_CONNECT_TIMEOUT_SECONDS:5}
      request-timeout-seconds: ${VEROX_WEBHOOK_REQUEST_TIMEOUT_SECONDS:10}
      max-attempts: ${VEROX_WEBHOOK_MAX_ATTEMPTS:8}
      base-retry-seconds: ${VEROX_WEBHOOK_BASE_RETRY_SECONDS:10}
      max-retry-seconds: ${VEROX_WEBHOOK_MAX_RETRY_SECONDS:900}

logging:
  level:
    root: INFO
