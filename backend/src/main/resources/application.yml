spring:
  application:
    name: verox-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/verox}
    username: ${DB_USERNAME:verox}
    password: ${DB_PASSWORD:verox_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

verox:
  bootstrap:
    enabled: ${VEROX_BOOTSTRAP_ENABLED:false}
    merchant-name: ${VEROX_BOOTSTRAP_MERCHANT_NAME:VEROX MVP Merchant}
    environment: ${VEROX_BOOTSTRAP_ENVIRONMENT:TEST}
  bridge:
    bootstrap:
      enabled: ${VEROX_BRIDGE_BOOTSTRAP_ENABLED:false}
      merchant-name: ${VEROX_BRIDGE_BOOTSTRAP_MERCHANT_NAME:VEROX MVP Merchant}
      name: ${VEROX_BRIDGE_BOOTSTRAP_NAME:M-Pesa Receiving Bridge}
      provider: ${VEROX_BRIDGE_BOOTSTRAP_PROVIDER:MPESA}
  checkout:
    base-url: ${VEROX_CHECKOUT_BASE_URL:http://localhost:3000}
    session-ttl-minutes: ${VEROX_CHECKOUT_TTL_MINUTES:15}

logging:
  level:
    root: INFO
