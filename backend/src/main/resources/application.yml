spring:
  application:
    name: verox-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/verox}
    username: ${DB_USERNAME:verox}
    password: ${DB_PASSWORD:verox_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

verox:
  bootstrap:
    enabled: ${VEROX_BOOTSTRAP_ENABLED:false}
    merchant-name: ${VEROX_BOOTSTRAP_MERCHANT_NAME:VEROX MVP Merchant}
    environment: ${VEROX_BOOTSTRAP_ENVIRONMENT:TEST}

logging:
  level:
    root: INFO
