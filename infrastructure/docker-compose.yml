services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: verox
      POSTGRES_USER: verox
      POSTGRES_PASSWORD: verox_dev
    ports:
      - "5432:5432"
    volumes:
      - verox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verox -d verox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  verox_postgres_data:
